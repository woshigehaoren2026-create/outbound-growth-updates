name: Portable installation verification
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to verify
        required: true
        type: string
permissions:
  contents: write
jobs:
  install-and-start:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download draft package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[1-9][0-9]*$') { throw 'Invalid tag' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern installer-cross-platform.zip --dir .
          if ($LASTEXITCODE -ne 0) { throw 'Package download failed' }
          Expand-Archive -LiteralPath installer-cross-platform.zip -DestinationPath app
      - name: Install with the included script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location app
          if ($IsWindows) { cmd /c 'install-windows.cmd < nul' }
          else { sh install-linux.sh }
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
      - name: Start and test an empty local installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $PWD 'app'
          $env:DATA_DIR = Join-Path $app 'test-data'
          $env:PORT = '33457'
          $node = (Get-Command node).Source
          $stdout = Join-Path $PWD 'app-stdout.log'
          $stderr = Join-Path $PWD 'app-stderr.log'
          if ($IsWindows) { $proc = Start-Process -FilePath $node -ArgumentList @('portable-bootstrap.mjs','supervisor') -WorkingDirectory $app -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru }
          else { $proc = Start-Process -FilePath $node -ArgumentList @('portable-bootstrap.mjs','supervisor') -WorkingDirectory $app -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru }
          try {
            $base = 'http://localhost:33457'
            $ready = $false
            for ($i=0; $i -lt 90; $i++) {
              try { $r = Invoke-WebRequest "$base/setup" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ready = $true; break } } catch {}
              Start-Sleep -Seconds 2
            }
            if (!$ready) { if (Test-Path $stderr) { Get-Content $stderr }; throw 'App did not start' }
            $body = @{displayName='Test';email='test@example.invalid';password='synthetic-password-123';passwordConfirmation='synthetic-password-123'}
            $setup = Invoke-WebRequest "$base/api/auth/setup" -Method POST -Headers @{Origin=$base} -Body $body -SessionVariable session -MaximumRedirection 3 -UseBasicParsing
            if ($setup.StatusCode -ne 200 -or $setup.BaseResponse.RequestMessage.RequestUri.AbsolutePath -ne '/dashboard') { throw 'Synthetic setup failed' }
            $preview = Invoke-RestMethod "$base/api/products/bulk?kind=preview" -WebSession $session
            if ($preview.count -ne 0) { throw 'Installation was not empty' }
            foreach ($route in @('/quotes','/analytics','/social-video','/outreach')) {
              $page=Invoke-WebRequest "$base$route" -WebSession $session -UseBasicParsing
              if ($page.StatusCode -ne 200) { throw "Page failed: $route" }
            }
            Write-Output 'PASS: installation, local startup, blank product data, authenticated routes.'
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
